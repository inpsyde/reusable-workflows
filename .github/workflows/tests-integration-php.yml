name: Integration tests PHP

on:
  workflow_call:
    inputs:
      PHP_VERSION:
        description: PHP version with which the scripts are executed.
        default: '8.2'
        required: false
        type: string
      PHP_EXTENSIONS:
        description: PHP extensions supported by shivammathur/setup-php to be installed or disabled.
        default: ''
        required: false
        type: string
      COMPOSER_ARGS:
        description: Set of arguments passed to Composer.
        default: '--prefer-dist'
        required: false
        type: string
      PHPUNIT_ARGS:
        description: Set of arguments passed to PHPUnit.
        default: '--no-coverage'
        required: false
        type: string
      BUILD_ASSETS:
        description: Whether to install the npm dependencies and build the assets before the tests.
        type: boolean
        default: false
        required: false
      NODE_VERSION:
        description: Node version with which the assets are built.
        default: '24'
        required: false
        type: string
      NPM_REGISTRY_DOMAIN:
        description: Domain of the private npm registry.
        default: https://npm.pkg.github.com/
        required: false
        type: string
    secrets:
      COMPOSER_AUTH_JSON:
        description: Authentication for privately hosted packages and repositories as a JSON formatted object.
        required: false
      ENV_VARS:
        description: Additional environment variables as a JSON formatted object.
        required: false
      NPM_REGISTRY_TOKEN:
        description: Authentication for the private npm registry.
        required: false
      GITHUB_USER_EMAIL:
        description: Email address for the GitHub user configuration.
        required: false
      GITHUB_USER_NAME:
        description: Username for the GitHub user configuration.
        required: false
      GITHUB_USER_SSH_KEY:
        description: Private SSH key associated with the GitHub user passed as `GITHUB_USER_NAME`.
        required: false

jobs:
  tests-integration-php:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check PHPUnit configuration
        run: |
          if [ ! -f phpunit-integration.xml.dist ]; then
            echo "::error::file phpunit-integration.xml.dist not found - The PHPUnit integration configuration is missing."
            exit 1
          fi

      - name: Set up custom environment variables
        env:
          ENV_VARS: ${{ secrets.ENV_VARS }}
        if: ${{ env.ENV_VARS }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            JSON
              .parse(process.env.ENV_VARS)
              .forEach(envVar => core.exportVariable(envVar.name, envVar.value));

      - name: Set up Git
        uses: inpsyde/reusable-workflows/.github/actions/setup-git@ce4cfd9ad8176f895d09ae11cb12dd65590cc94e # main
        with:
          ssh-private-key: ${{ secrets.GITHUB_USER_SSH_KEY }}
          user-email: ${{ secrets.GITHUB_USER_EMAIL }}
          user-name: ${{ secrets.GITHUB_USER_NAME }}

      - name: Set up Node
        if: ${{ inputs.BUILD_ASSETS }}
        uses: inpsyde/reusable-workflows/.github/actions/setup-node@ce4cfd9ad8176f895d09ae11cb12dd65590cc94e # main
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          registry-url: ${{ inputs.NPM_REGISTRY_DOMAIN }}
          node-auth-token: ${{ secrets.NPM_REGISTRY_TOKEN }}

      # The integration tests can need compiled assets (e.g. `blocks-manifest.php`), which Git does not track.
      - name: Build assets
        if: ${{ inputs.BUILD_ASSETS }}
        run: npm run build --if-present

      - name: Set up PHP
        uses: inpsyde/reusable-workflows/.github/actions/setup-php@ce4cfd9ad8176f895d09ae11cb12dd65590cc94e # main
        with:
          php-version: ${{ inputs.PHP_VERSION }}
          php-extensions: ${{ inputs.PHP_EXTENSIONS }}
          php-tools: ''
          coverage: ''
          composer-options: ${{ inputs.COMPOSER_ARGS }}
          composer-auth-json: ${{ secrets.COMPOSER_AUTH_JSON }}

      - name: Set up problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run PHPUnit
        run: ./$(composer config bin-dir)/phpunit -c phpunit-integration.xml.dist ${{ inputs.PHPUNIT_ARGS }}
